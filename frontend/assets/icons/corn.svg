<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="60%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <linearGradient id="huskGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="60%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#A5D6A7" />
    </linearGradient>
  </defs>
  <g transform="rotate(35 50 50)">
    <!-- Husks at base / sides -->
    <path d="M42 65 C30 75 15 80 18 68 C22 55 35 48 45 42" fill="url(#huskGrad)" stroke="#1B5E20" stroke-width="2" />
    <path d="M58 65 C70 75 85 80 82 68 C78 55 65 48 55 42" fill="url(#huskGrad)" stroke="#1B5E20" stroke-width="2" />
    
    <!-- Yellow Cob Body -->
    <path d="M38 68 C34 50 38 28 50 16 C62 28 66 50 62 68 C58 74 42 74 38 68 Z" fill="url(#cornGrad)" stroke="#E65100" stroke-width="2.5" />
    
    <!-- Corn Kernels Grid / Texture -->
    <!-- Row 1 -->
    <ellipse cx="50" cy="24" rx="4" ry="3" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <!-- Row 2 -->
    <ellipse cx="45" cy="32" rx="4.5" ry="3.5" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="55" cy="32" rx="4.5" ry="3.5" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <!-- Row 3 -->
    <ellipse cx="42" cy="41" rx="5" ry="3.8" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="50" cy="41" rx="5" ry="3.8" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="58" cy="41" rx="5" ry="3.8" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <!-- Row 4 -->
    <ellipse cx="42" cy="51" rx="5.2" ry="4" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="50" cy="51" rx="5.2" ry="4" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="58" cy="51" rx="5.2" ry="4" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <!-- Row 5 -->
    <ellipse cx="44" cy="61" rx="5" ry="3.8" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="50" cy="61" rx="5" ry="3.8" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    <ellipse cx="56" cy="61" rx="5" ry="3.8" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2" />
    
    <!-- Foreground husk wrapping bottom -->
    <path d="M35 72 C42 62 58 62 65 72 C58 78 42 78 35 72 Z" fill="#4CAF50" stroke="#1B5E20" stroke-width="2" />
    <!-- Stem tip -->
    <path d="M47 74 L47 84 C47 86 53 86 53 84 L53 74 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5" />
  </g>
</svg>
