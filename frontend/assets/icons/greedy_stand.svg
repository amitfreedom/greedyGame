<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 380" width="100%" height="100%">
  <defs>
    <!-- Leg gradient: 3D metallic blue -->
    <linearGradient id="legGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81D4FA" />
      <stop offset="35%" stop-color="#29B6F6" />
      <stop offset="85%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <linearGradient id="legGradRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#81D4FA" />
      <stop offset="35%" stop-color="#29B6F6" />
      <stop offset="85%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="60%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="70%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <filter id="standShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#standShadow)">
    <!-- 1. Diagonal Inner Struts / Bracing Arms connecting hub to legs -->
    <!-- Left diagonal strut -->
    <line x1="165" y1="160" x2="88" y2="280" stroke="#0288D1" stroke-width="10" stroke-linecap="round" />
    <line x1="165" y1="160" x2="88" y2="280" stroke="#01579B" stroke-width="12" stroke-linecap="round" style="stroke-opacity: 0.3;" />
    <line x1="165" y1="160" x2="88" y2="280" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round" />

    <!-- Right diagonal strut -->
    <line x1="165" y1="160" x2="242" y2="280" stroke="#0288D1" stroke-width="10" stroke-linecap="round" />
    <line x1="165" y1="160" x2="242" y2="280" stroke="#01579B" stroke-width="12" stroke-linecap="round" style="stroke-opacity: 0.3;" />
    <line x1="165" y1="160" x2="242" y2="280" stroke="#4FC3F7" stroke-width="4" stroke-linecap="round" />

    <!-- 2. Mid Cross-Beam Lattice -->
    <path d="M 98 226 L 232 226 L 232 238 L 98 238 Z" fill="url(#beamGrad)" stroke="#01579B" stroke-width="2.5" />
    <!-- Rivets on mid cross-beam -->
    <circle cx="106" cy="232" r="3" fill="#E1F5FE" stroke="#01579B" stroke-width="1" />
    <circle cx="165" cy="232" r="3" fill="#E1F5FE" stroke="#01579B" stroke-width="1" />
    <circle cx="224" cy="232" r="3" fill="#E1F5FE" stroke="#01579B" stroke-width="1" />

    <!-- 3. Lower Horizontal Base Tie-Beam (Lower Base) -->
    <path d="M 52 328 L 278 328 L 278 344 L 52 344 Z" fill="url(#beamGrad)" stroke="#01579B" stroke-width="3" />
    <!-- Rivet strip on lower base beam -->
    <circle cx="68" cy="336" r="3.5" fill="#E1F5FE" stroke="#01579B" stroke-width="1.2" />
    <circle cx="116" cy="336" r="3.5" fill="#E1F5FE" stroke="#01579B" stroke-width="1.2" />
    <circle cx="165" cy="336" r="3.5" fill="#E1F5FE" stroke="#01579B" stroke-width="1.2" />
    <circle cx="214" cy="336" r="3.5" fill="#E1F5FE" stroke="#01579B" stroke-width="1.2" />
    <circle cx="262" cy="336" r="3.5" fill="#E1F5FE" stroke="#01579B" stroke-width="1.2" />

    <!-- 4. Left A-Frame Truss Leg -->
    <polygon points="144,142 160,142 66,356 42,356" fill="url(#legGradLeft)" stroke="#01579B" stroke-width="3" stroke-linejoin="round" />
    <!-- Left Leg Specular Highlight -->
    <line x1="149" y1="148" x2="52" y2="350" stroke="#B3E5FC" stroke-width="2.5" stroke-linecap="round" />
    <!-- Rivets on left leg -->
    <circle cx="140" cy="180" r="2.8" fill="#FFFFFF" stroke="#01579B" stroke-width="1" />
    <circle cx="114" cy="232" r="2.8" fill="#FFFFFF" stroke="#01579B" stroke-width="1" />
    <circle cx="86" cy="290" r="2.8" fill="#FFFFFF" stroke="#01579B" stroke-width="1" />

    <!-- 5. Right A-Frame Truss Leg -->
    <polygon points="170,142 186,142 288,356 264,356" fill="url(#legGradRight)" stroke="#01579B" stroke-width="3" stroke-linejoin="round" />
    <!-- Right Leg Specular Highlight -->
    <line x1="175" y1="148" x2="272" y2="350" stroke="#B3E5FC" stroke-width="2.5" stroke-linecap="round" />
    <!-- Rivets on right leg -->
    <circle cx="190" cy="180" r="2.8" fill="#FFFFFF" stroke="#01579B" stroke-width="1" />
    <circle cx="216" cy="232" r="2.8" fill="#FFFFFF" stroke="#01579B" stroke-width="1" />
    <circle cx="244" cy="290" r="2.8" fill="#FFFFFF" stroke="#01579B" stroke-width="1" />

    <!-- 6. Heavy Steel Footing Shoes / Mounting Baseplates at the bottom -->
    <!-- Left Footing Shoe -->
    <path d="M 32 344 L 78 344 L 88 368 L 22 368 Z" fill="url(#shoeGrad)" stroke="#01579B" stroke-width="3" stroke-linejoin="round" />
    <!-- Left Footing Mounting Plate Highlight -->
    <line x1="30" y1="347" x2="76" y2="347" stroke="#E1F5FE" stroke-width="2" />
    <!-- Heavy anchor bolts on left shoe -->
    <circle cx="34" cy="358" r="4" fill="#FFD54F" stroke="#E65100" stroke-width="1.5" />
    <circle cx="55" cy="358" r="4" fill="#FFD54F" stroke="#E65100" stroke-width="1.5" />
    <circle cx="76" cy="358" r="4" fill="#FFD54F" stroke="#E65100" stroke-width="1.5" />

    <!-- Right Footing Shoe -->
    <path d="M 252 344 L 298 344 L 308 368 L 242 368 Z" fill="url(#shoeGrad)" stroke="#01579B" stroke-width="3" stroke-linejoin="round" />
    <!-- Right Footing Mounting Plate Highlight -->
    <line x1="254" y1="347" x2="300" y2="347" stroke="#E1F5FE" stroke-width="2" />
    <!-- Heavy anchor bolts on right shoe -->
    <circle cx="254" cy="358" r="4" fill="#FFD54F" stroke="#E65100" stroke-width="1.5" />
    <circle cx="275" cy="358" r="4" fill="#FFD54F" stroke="#E65100" stroke-width="1.5" />
    <circle cx="296" cy="358" r="4" fill="#FFD54F" stroke="#E65100" stroke-width="1.5" />

    <!-- 7. Center Hub Mounting Flange / Bearing Collar -->
    <circle cx="165" cy="154" r="54" fill="none" stroke="#0288D1" stroke-width="6" stroke-dasharray="16 8" />
    <circle cx="165" cy="154" r="48" fill="#01579B" stroke="#004D80" stroke-width="2" opacity="0.4" />
  </g>
</svg>
