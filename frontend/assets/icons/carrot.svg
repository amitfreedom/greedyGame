    <path d="M52 54 Q60 56 61 54" fill="none" stroke="#BF360C" stroke-width="2" stroke-linecap="round" />
    <path d="M40 64 Q46 66 49 64" fill="none" stroke="#BF360C" stroke-width="2" stroke-linecap="round" />
    <path d="M50 72 Q56 74 58 72" fill="none" stroke="#BF360C" stroke-width="2" stroke-linecap="round" />
    <path d="M45 80 Q49 82 52 80" fill="none" stroke="#BF360C" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Top stem join -->
