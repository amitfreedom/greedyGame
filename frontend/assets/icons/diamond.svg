<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="diaTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="50%" stop-color="#81D4FA" />
      <stop offset="100%" stop-color="#4FC3F7" />
    </linearGradient>
    <linearGradient id="diaLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="diaCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81D4FA" />
      <stop offset="100%" stop-color="#03A9F4" />
    </linearGradient>
    <linearGradient id="diaRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>
  </defs>
  <!-- Drop shadow -->
  <polygon points="50,86 16,36 84,36" fill="#0D47A1" opacity="0.4" />
  
  <!-- Crown / Top Table -->
  <polygon points="32,20 68,20 84,36 16,36" fill="url(#diaTop)" stroke="#0277BD" stroke-width="1.8" />
  
  <!-- Bottom Pavilion Facets -->
  <polygon points="16,36 34,36 50,84" fill="url(#diaLeft)" stroke="#0277BD" stroke-width="1.5" />
  <polygon points="34,36 66,36 50,84" fill="url(#diaCenter)" stroke="#0277BD" stroke-width="1.5" />
  <polygon points="66,36 84,36 50,84" fill="url(#diaRight)" stroke="#0277BD" stroke-width="1.5" />
  
  <!-- Top facets -->
  <polygon points="32,20 50,20 50,36 34,36" fill="#E1F5FE" opacity="0.6" />
  <polygon points="50,20 68,20 66,36 50,36" fill="#B3E5FC" opacity="0.6" />
  
  <!-- Sparkle stars -->
  <polygon points="76,14 78,20 84,22 78,24 76,30 74,24 68,22 74,20" fill="#FFFFFF" />
  <polygon points="22,46 23,49 26,50 23,51 22,54 21,51 18,50 21,49" fill="#FFFFFF" />
</svg>
