<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="coinG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="60%" stop-color="#FFD54F" />
      <stop offset="85%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </radialGradient>
    <linearGradient id="innerG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Rim with 3D edge -->
  <circle cx="50" cy="52" r="44" fill="#C47900" />
  <circle cx="50" cy="48" r="44" fill="url(#coinG)" stroke="#FF8F00" stroke-width="2.5" />
  <!-- Inner Coin Ring -->
  <circle cx="50" cy="48" r="34" fill="url(#innerG)" stroke="#FFB300" stroke-width="2.5" stroke-dasharray="6 3" />
  <!-- Dollar / Coin Star Motif in center -->
  <circle cx="50" cy="48" r="22" fill="#FFC107" stroke="#FF8F00" stroke-width="2" />
  <!-- Embossed Star in center -->
  <polygon points="50,33 54,43 65,44 56,51 59,62 50,56 41,62 44,51 35,44 46,43" fill="#FFF9C4" stroke="#FFA000" stroke-width="1.2" />
  <!-- Specular highlights -->
  <ellipse cx="36" cy="30" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 36 30)" />
</svg>
